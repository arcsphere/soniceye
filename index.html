<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;700;800&family=Oswald:wght@400;500;700&family=Playfair+Display:wght@400;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div id="canvas-wrap">
          <canvas id="preview"></canvas>
          <div id="empty">
            <p>Drop an audio file here, or use <strong>Load demo track</strong> in the panel.</p>
            <p class="hint">Audio → visualizer · video → background · image → cover art</p>
          </div>
        </div>
        <div id="transport">
          <button id="play" class="btn" type="button" title="Play / pause (space)">▶</button>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="time">0:00 / 0:00</span>
        </div>
        <div id="status"></div>
      </main>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
